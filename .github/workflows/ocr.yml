# OCR one constituency. Dispatched by scripts/home/run.py as soon as that AC's
# crop tar is uploaded, so OCR runs while home is still downloading the rest.
#
# kind=kan  crops-<ac>.tar      -> rows-<ac>.jsonl.gz + summary, then the verifier
# kind=eng  crops-eng-<ac>.tar  -> eng-<ac>.jsonl.gz + summary (English cross-check
#                                  part, V5), then a republish
#
# The parts are split over `shards` parallel jobs (default 16; one 4-core runner
# alone reads a 600-part AC in ~1.5 h); `merge` joins their rows into exactly what one job
# writes. Shard rows travel through a draft release, never as Actions
# artifacts: on a public repo any signed-in user can download those. Files in
# transit (a VM's part PDFs, shard rows and crops) use a second draft,
# <tag>-work, so they never count against the 1,000-asset limit of the release
# that keeps every AC's live files. A VM AC's joined crops go to a third,
# <tag>-crops, kept for the full verification; once an AC is promoted its
# rows/summary/verify (the same bytes as its live-* copies) are dropped.
name: OCR constituency
run-name: OCR AC ${{ inputs.ac }} (${{ inputs.kind || 'kan' }})

on:
  workflow_dispatch:
    inputs:
      ac:
        description: Assembly constituency number
        required: true
      tag:
        description: Draft release carrying the crops (see roll-source.json)
        required: true
      kind:
        description: kan (home-cut crops), pdf (raw part PDFs from a cloud VM, cut here) or eng
        required: false
        default: kan
      shards:
        description: parallel OCR jobs for this AC
        required: false
        default: '16'

permissions:
  contents: write   # read/write assets on the draft release
  actions: write    # dispatch the next workflow

concurrency:
  group: ocr-${{ inputs.ac }}-${{ inputs.kind == 'eng' && 'eng' || 'kan' }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.n.outputs.shards }}
      list: ${{ steps.n.outputs.list }}
      ids: ${{ steps.ids.outputs.ids }}
    steps:
      - id: n
        env:
          WANT: ${{ inputs.kind == 'eng' && '1' || inputs.shards || '16' }}
        run: |
          n=$(( WANT < 1 ? 1 : (WANT > 20 ? 20 : WANT) ))
          echo "shards=$n" >> "$GITHUB_OUTPUT"
          echo "list=$(python3 -c "print(list(range($n)))")" >> "$GITHUB_OUTPUT"

      # Look the input files up once, here: a shard that lists the releases
      # itself costs 10-30 API calls, and Actions may make 1,000 an hour.
      - uses: actions/checkout@v4
      - id: ids
        env:
          GH_TOKEN: ${{ secrets.ROLL_TOKEN || github.token }}
          ROLL_RELEASE: ${{ inputs.tag }}
          AC: ${{ inputs.ac }}
          KIND: ${{ inputs.kind || 'kan' }}
          SHARDS: ${{ steps.n.outputs.shards }}
        run: |
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import json, os, sys
          sys.path.insert(0, 'scripts')
          import release
          ac, kind, n, tag = os.environ['AC'], os.environ['KIND'], int(os.environ['SHARDS']), os.environ['ROLL_RELEASE']
          if kind == 'pdf':
              names = [f'pdfs-{ac}.s{i}.tar' for i in range(n)]
              tags = [f'{tag}-work', tag]
          else:
              names = [f'crops-eng-{ac}.tar' if kind == 'eng' else f'crops-{ac}.tar'] * n
              tags = [tag]
          ids = {}
          for t in tags:
              release.TAG = t
              found = release.assets()
              for i, name in enumerate(names):
                  if str(i) not in ids and name in found:
                      ids[str(i)] = found[name]['id']
              if len(ids) == n:
                  break
          print('ids=' + json.dumps(ids))
          EOF

  ocr:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: true
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.list) }}
    env:
      GH_TOKEN: ${{ secrets.ROLL_TOKEN || github.token }}
      ROLL_RELEASE: ${{ inputs.tag }}
      AC: ${{ inputs.ac }}
      KIND: ${{ inputs.kind || 'kan' }}
      SHARD: ${{ matrix.shard }}
      SHARDS: ${{ needs.plan.outputs.shards }}
      WORK: ${{ inputs.tag }}-work
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/ocr/requirements.txt

      - name: Install Tesseract
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-eng
          tesseract --version | head -1

      - run: pip install --disable-pip-version-check -r scripts/ocr/requirements.txt

      - name: Name the files
        run: |
          if [ "$KIND" = eng ]; then
            echo "TAR=crops-eng-$AC.tar" >> "$GITHUB_ENV"; echo "OUT=eng-$AC" >> "$GITHUB_ENV"
          elif [ "$KIND" = pdf ]; then
            # The VM split the part PDFs the way ocr_ac.py splits shards.
            echo "TAR=pdfs-$AC.s$SHARD.tar" >> "$GITHUB_ENV"; echo "OUT=rows-$AC" >> "$GITHUB_ENV"
          else
            echo "TAR=crops-$AC.tar" >> "$GITHUB_ENV"; echo "OUT=rows-$AC" >> "$GITHUB_ENV"
          fi

      - name: Fetch crops
        env:
          ID: ${{ fromJSON(needs.plan.outputs.ids)[format('{0}', matrix.shard)] }}
        run: |
          if [ -n "$ID" ]; then
            mkdir -p work
            gh api -H 'Accept: application/octet-stream' "repos/$GITHUB_REPOSITORY/releases/assets/$ID" > "work/$TAR"
          elif [ "$KIND" = pdf ]; then
            # PDFs shipped before the work release existed are still on the main one.
            ROLL_RELEASE="$WORK" python scripts/release.py download "$TAR" work || python scripts/release.py download "$TAR" work
          else
            python scripts/release.py download "$TAR" work
          fi

      - name: OCR
        run: |
          if [ "$KIND" = pdf ]; then
            python scripts/ci/ocr_ac.py "work/$TAR" "work/$OUT.s$SHARD.jsonl.gz" --shard "$SHARD/$SHARDS" --crops-out "work/crops-$AC.s$SHARD.tar"
          else
            python scripts/ci/ocr_ac.py "work/$TAR" "work/$OUT.s$SHARD.jsonl.gz" --shard "$SHARD/$SHARDS"
          fi

      # One file per shard (rows, summary, and for PDFs the crops it cut):
      # every asset costs API calls to upload, list and delete.
      - name: Return shard rows
        run: |
          files="$OUT.s$SHARD.jsonl.gz $OUT.s$SHARD.summary.json"
          if [ "$KIND" = pdf ]; then files="$files crops-$AC.s$SHARD.tar"; fi
          tar cf "work/out-$OUT.s$SHARD.tar" -C work $files
          ROLL_RELEASE="$WORK" python scripts/release.py upload "work/out-$OUT.s$SHARD.tar"

  merge:
    needs: [plan, ocr]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ secrets.ROLL_TOKEN || github.token }}
      ROLL_RELEASE: ${{ inputs.tag }}
      AC: ${{ inputs.ac }}
      KIND: ${{ inputs.kind || 'kan' }}
      SHARDS: ${{ needs.plan.outputs.shards }}
      WORK: ${{ inputs.tag }}-work
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/ocr/requirements.txt

      - if: vars.VERIFY == 'paused'
        run: pip install --disable-pip-version-check -r scripts/ocr/requirements.txt

      - name: Name the files
        run: |
          if [ "$KIND" = eng ]; then
            echo "TAR=crops-eng-$AC.tar" >> "$GITHUB_ENV"; echo "OUT=eng-$AC" >> "$GITHUB_ENV"
          else
            echo "TAR=crops-$AC.tar" >> "$GITHUB_ENV"; echo "OUT=rows-$AC" >> "$GITHUB_ENV"
          fi

      - name: Fetch shard rows
        run: |
          ROLL_RELEASE="$WORK" python scripts/release.py fetch work $(for i in $(seq 0 $((SHARDS - 1))); do echo "out-$OUT.s$i.tar"; done)
          for i in $(seq 0 $((SHARDS - 1))); do tar xf "work/out-$OUT.s$i.tar" -C work; rm "work/out-$OUT.s$i.tar"; done

      - name: Merge
        run: python scripts/ci/ocr_ac.py merge "work/$OUT.jsonl.gz" work/$OUT.s*.jsonl.gz

      # Paused verification keeps no copy of a promoted AC's rows on the main
      # release (its live-* files are that copy); see Hand over.
      - name: Return rows
        if: vars.VERIFY != 'paused' || inputs.kind == 'eng'
        run: python scripts/release.py upload "work/$OUT.jsonl.gz" "work/$OUT.summary.json"

      - name: Remove shard rows
        run: |
          ROLL_RELEASE="$WORK" python scripts/release.py delete $(for i in $(seq 0 $((SHARDS - 1))); do echo "out-$OUT.s$i.tar"; done)

      # Raw PDFs from a VM: join the shards' crops into the crops-<ac>.tar the
      # verifier reads (as home would have shipped it), then drop the PDFs.
      - name: Join crops
        if: inputs.kind == 'pdf'
        run: |
          python - <<'EOF'
          import io, json, os, tarfile
          ac, n = os.environ['AC'], int(os.environ['SHARDS'])
          s = json.load(open(f'work/rows-{ac}.summary.json'))
          parts = sorted({int(p) for p in s['perPart']} | set(s['unread']))
          with tarfile.open(f'work/crops-{ac}.tar', 'w') as out:
              for i in range(n):
                  with tarfile.open(f'work/crops-{ac}.s{i}.tar') as t:
                      for m in t.getmembers():
                          out.addfile(m, t.extractfile(m))
              meta = json.dumps({'ac': int(ac), 'parts': parts, 'failed': s['unread'], 'lang': 'kan'}).encode()
              info = tarfile.TarInfo('meta.json'); info.size = len(meta)
              out.addfile(info, io.BytesIO(meta))
          EOF
          ROLL_RELEASE="$ROLL_RELEASE-crops" python scripts/release.py upload "work/crops-$AC.tar"
          ROLL_RELEASE="$WORK" python scripts/release.py delete $(for i in $(seq 0 $((SHARDS - 1))); do echo "pdfs-$AC.s$i.tar"; done)

      # Round letters (C/O/G/Q) the per-card readers could not settle, decided
      # by the series the rest of the AC confirms (scripts/ocr/series_pass.py).
      - name: Series pass
        if: inputs.kind == 'pdf' && vars.VERIFY == 'paused'
        run: |
          python scripts/ocr/series_pass.py "work/crops-$AC.tar" "work/$OUT.jsonl.gz" "work/$OUT.series.jsonl.gz"
          mv "work/$OUT.series.jsonl.gz" "work/$OUT.jsonl.gz"
          mv "work/$OUT.series.summary.json" "work/$OUT.summary.json"

      # The Kannada crops stay for the verifier, which re-reads every card.
      # With the repo variable VERIFY=paused the per-card checks are skipped:
      # the whole-AC checks (V2 order/duplicates, V3 printed totals and
      # deletions) run here on the rows alone, a pass goes live at once, and
      # the crops stay on the release so verify.yml can run in full later.
      - name: Hand over
        env:
          VERIFY: ${{ vars.VERIFY }}
        run: |
          if [ "$KIND" = eng ]; then
            python scripts/release.py delete "$TAR"
            gh workflow run publish.yml -R "$GITHUB_REPOSITORY" -f tag="$ROLL_RELEASE"
          elif [ "$VERIFY" = paused ]; then
            python scripts/ci/verify_ac.py "$AC" - "work/$OUT.jsonl.gz" "work/$OUT.summary.json" out --quick
            if python -c "import json,sys; sys.exit(json.load(open('out/verify-$AC.json'))['verdict'] != 'pass')"; then
              mkdir -p live
              cp "work/$OUT.jsonl.gz" "live/live-rows-$AC.jsonl.gz"
              cp "work/$OUT.summary.json" "live/live-rows-$AC.summary.json"
              cp "out/verify-$AC.json" "live/live-verify-$AC.json"
              python scripts/release.py replace live/live-rows-$AC.jsonl.gz live/live-rows-$AC.summary.json live/live-verify-$AC.json
              echo "AC $AC promoted to live (per-card checks paused)"
            else
              python scripts/release.py upload "work/$OUT.jsonl.gz" "work/$OUT.summary.json" "out/verify-$AC.json"
              echo "AC $AC held by the whole-AC checks: its live version (if any) stays as it is"
            fi
            gh workflow run publish.yml -R "$GITHUB_REPOSITORY" -f tag="$ROLL_RELEASE"
          else
            gh workflow run verify.yml -R "$GITHUB_REPOSITORY" -f ac="$AC" -f tag="$ROLL_RELEASE"
          fi
