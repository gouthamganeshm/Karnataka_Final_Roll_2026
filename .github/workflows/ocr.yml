# OCR one constituency. Dispatched by scripts/home/run.py as soon as that AC's
# crop tar is uploaded, so OCR runs while home is still downloading the rest.
#
# kind=kan  crops-<ac>.tar      -> rows-<ac>.jsonl.gz + summary, then the verifier
# kind=eng  crops-eng-<ac>.tar  -> eng-<ac>.jsonl.gz + summary (English cross-check
#                                  part, V5), then a republish
name: OCR constituency
run-name: OCR AC ${{ inputs.ac }} (${{ inputs.kind || 'kan' }})

on:
  workflow_dispatch:
    inputs:
      ac:
        description: Assembly constituency number
        required: true
      tag:
        description: Draft release carrying the crops (see roll-source.json)
        required: true
      kind:
        description: kan (the roll) or eng (the English cross-check part)
        required: false
        default: kan

permissions:
  contents: write   # read/write assets on the draft release
  actions: write    # dispatch the next workflow

concurrency:
  group: ocr-${{ inputs.ac }}-${{ inputs.kind || 'kan' }}
  cancel-in-progress: false

jobs:
  ocr:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      GH_TOKEN: ${{ github.token }}
      ROLL_RELEASE: ${{ inputs.tag }}
      AC: ${{ inputs.ac }}
      KIND: ${{ inputs.kind || 'kan' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/ocr/requirements.txt

      - name: Install Tesseract
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-eng
          tesseract --version | head -1

      - run: pip install --disable-pip-version-check -r scripts/ocr/requirements.txt

      - name: Name the files
        run: |
          if [ "$KIND" = eng ]; then
            echo "TAR=crops-eng-$AC.tar" >> "$GITHUB_ENV"; echo "OUT=eng-$AC" >> "$GITHUB_ENV"
          else
            echo "TAR=crops-$AC.tar" >> "$GITHUB_ENV"; echo "OUT=rows-$AC" >> "$GITHUB_ENV"
          fi

      - name: Fetch crops
        run: python scripts/release.py download "$TAR" work

      - name: OCR
        run: python scripts/ci/ocr_ac.py "work/$TAR" "work/$OUT.jsonl.gz"

      - name: Return rows
        run: python scripts/release.py upload "work/$OUT.jsonl.gz" "work/$OUT.summary.json"

      # The Kannada crops stay for the verifier, which re-reads every card.
      - name: Hand over
        run: |
          if [ "$KIND" = eng ]; then
            python scripts/release.py delete "$TAR"
            gh workflow run publish.yml -R "$GITHUB_REPOSITORY" -f tag="$ROLL_RELEASE"
          else
            gh workflow run verify.yml -R "$GITHUB_REPOSITORY" -f ac="$AC" -f tag="$ROLL_RELEASE"
          fi
