# Build the hashed buckets from every OCR'd constituency so far and deploy the
# site to GitHub Pages. Every finished OCR job dispatches this, so the site fills
# in constituency by constituency instead of waiting for the whole state.
#
# The concurrency group keeps one run going and one queued; a newer dispatch
# replaces the queued one, so a burst of finished ACs costs one extra build,
# not one per AC — and a running deploy is never cancelled half way.
name: Publish site

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Draft release carrying the rows (blank = roll-source.json)
        required: false
      allow_drop:
        description: Deploy even if a live constituency would drop off the site
        type: boolean
        required: false
        default: false
  push:
    branches: [main]
    paths: ['site/**', 'scripts/ci/build.mjs']

permissions:
  contents: write   # the transfer release is a draft, visible only with write access
  pages: write
  id-token: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Only live-* files: rows and verdicts that passed verification (promoted
      # by verify.yml). A download failure fails the build: never deploy a
      # partial site.
      - name: Collect verified rows
        env:
          ROLL_RELEASE: ${{ inputs.tag }}
        run: |
          [ -n "$ROLL_RELEASE" ] || unset ROLL_RELEASE
          python scripts/release.py download-all rows live- eng- manifest.json > /dev/null
          for f in rows/live-*; do mv "$f" "rows/${f#rows/live-}"; done
          ls rows | grep -c '^rows-.*jsonl.gz$'

      - name: Build buckets
        run: |
          node --max-old-space-size=8192 scripts/ci/build.mjs rows _site
          du -sh _site

      # Every AC verified on the live site must still be verified in this build.
      - name: Never drop a live constituency
        if: ${{ !inputs.allow_drop }}
        run: |
          curl -fsS "https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/data/manifest.json?x=$RANDOM" -o live.json
          python - <<'EOF'
          import json, sys
          live = {a['ac'] for a in json.load(open('live.json', encoding='utf8'))['acs'] if a['status'] == 'verified'}
          new = {a['ac'] for a in json.load(open('_site/data/manifest.json', encoding='utf8'))['acs'] if a['status'] == 'verified'}
          gone = sorted(live - new)
          print(f'live {len(live)} verified ACs, this build {len(new)}')
          if gone:
              sys.exit(f'refusing to deploy: ACs {gone} are live but not verified in this build (dispatch with allow_drop to override)')
          EOF

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
