# Build the hashed buckets from every OCR'd constituency so far and deploy the
# site to GitHub Pages. Every finished OCR job dispatches this, so the site fills
# in constituency by constituency instead of waiting for the whole state.
#
# The concurrency group keeps one run going and one queued; a newer dispatch
# replaces the queued one, so a burst of finished ACs costs one extra build,
# not one per AC — and a running deploy is never cancelled half way.
name: Publish site

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Draft release carrying the rows (blank = roll-source.json)
        required: false
      allow_drop:
        description: Deploy even if a live constituency would drop off the site
        type: boolean
        required: false
        default: false
  push:
    branches: [main]
    paths: ['site/**', 'scripts/ci/build.mjs']

permissions:
  contents: write   # the transfer release is a draft, visible only with write access
  pages: write
  id-token: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ secrets.ROLL_TOKEN || github.token }}
      CACHE_KEY: ${{ secrets.ROLL_CACHE_KEY }}
    steps:
      # Actions may make 1,000 GitHub API calls an hour per repo, and OCR runs
      # need most of them: a build per finished AC, each fetching every live
      # file again, used them all up. So: at most one build per 20 minutes
      # (newer dispatches wait as the one queued run), and the live files are
      # kept between builds in an encrypted Actions cache (EPICs in plain text
      # must never sit where a fork's workflow could restore them), so only
      # files replaced since the last build are downloaded.
      - name: At most one build every 20 minutes
        run: |
          last=$(gh run list -R "$GITHUB_REPOSITORY" --workflow publish.yml --status success -L 1 --json createdAt -q '.[0].createdAt' || true)
          if [ -n "$last" ]; then
            wait=$(( $(date -d "$last" +%s) + 1200 - $(date +%s) ))
            if [ "$wait" -gt 0 ]; then echo "last build $last; waiting ${wait}s"; sleep "$wait"; fi
          fi

      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Only live-* files: rows and verdicts that passed verification (promoted
      # by verify.yml). A download failure fails the build: never deploy a
      # partial site.
      - uses: actions/cache/restore@v4
        if: env.CACHE_KEY != ''
        with:
          path: live-cache.enc
          key: live-${{ github.run_id }}
          restore-keys: live-

      - name: Collect verified rows
        env:
          ROLL_RELEASE: ${{ inputs.tag }}
        run: |
          [ -n "$ROLL_RELEASE" ] || unset ROLL_RELEASE
          mkdir -p live-cache rows
          if [ -n "$CACHE_KEY" ] && [ -f live-cache.enc ]; then
            openssl enc -d -aes-256-cbc -pbkdf2 -pass env:CACHE_KEY -in live-cache.enc | tar x || rm -rf live-cache/* live-cache/.asset-ids.json
          fi
          python scripts/release.py download-all live-cache --keep live- eng- manifest.json > /dev/null
          for f in live-cache/*; do n=$(basename "$f"); cp "$f" "rows/${n#live-}"; done
          ls rows | grep -c '^rows-.*jsonl.gz$'

      - name: Encrypt the download cache
        if: env.CACHE_KEY != ''
        run: tar c live-cache | openssl enc -aes-256-cbc -pbkdf2 -pass env:CACHE_KEY -out live-cache.enc

      - uses: actions/cache/save@v4
        if: env.CACHE_KEY != ''
        with:
          path: live-cache.enc
          key: live-${{ github.run_id }}

      - name: Build buckets
        run: |
          node --max-old-space-size=8192 scripts/ci/build.mjs rows _site
          du -sh _site

      # Every AC verified on the live site must still be verified in this build.
      - name: Never drop a live constituency
        if: ${{ !inputs.allow_drop }}
        run: |
          curl -fsS "https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/data/manifest.json?x=$RANDOM" -o live.json
          python - <<'EOF'
          import json, sys
          live = {a['ac'] for a in json.load(open('live.json', encoding='utf8'))['acs'] if a['status'] == 'verified'}
          new = {a['ac'] for a in json.load(open('_site/data/manifest.json', encoding='utf8'))['acs'] if a['status'] == 'verified'}
          gone = sorted(live - new)
          print(f'live {len(live)} verified ACs, this build {len(new)}')
          if gone:
              sys.exit(f'refusing to deploy: ACs {gone} are live but not verified in this build (dispatch with allow_drop to override)')
          EOF

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
