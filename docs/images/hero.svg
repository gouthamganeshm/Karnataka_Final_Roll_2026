<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-labelledby="t d">
  <title id="t">Karnataka Final Roll 2026</title>
  <desc id="d">Find your booth on Karnataka's SIR final electoral roll by your EPIC number. 4,54,55,689 electors, 224 of 224 constituencies matching the official count, 60,923 booths.</desc>
  <style>
    .bg{fill:#f7f5f0}.ink{fill:#1d1b18}.mute{fill:#6b655c}.card{fill:#fff;stroke:#d9d3c7}.line{fill:#e8e3d8}
    .acc{fill:#c2410c}.accs{stroke:#c2410c}.ok{fill:#15803d}.scan{fill:#c2410c;opacity:.12}.chip{fill:#fff;stroke:#e2dccf}
    @media (prefers-color-scheme:dark){
      .bg{fill:#14130f}.ink{fill:#f3efe6}.mute{fill:#a39d90}.card{fill:#1f1d18;stroke:#3a362e}.line{fill:#2c2923}
      .acc{fill:#fb923c}.accs{stroke:#fb923c}.ok{fill:#4ade80}.scan{fill:#fb923c;opacity:.14}.chip{fill:#1f1d18;stroke:#3a362e}}
    text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",sans-serif}
    .fade{opacity:0;animation:in .8s ease forwards}.f2{animation-delay:.25s}.f3{animation-delay:.5s}.f4{animation-delay:.75s}.f5{animation-delay:1s}
    @keyframes in{to{opacity:1}}
    .sweep{animation:sw 3.2s ease-in-out infinite}
    @keyframes sw{0%{transform:translateY(0)}50%{transform:translateY(176px)}100%{transform:translateY(0)}}
    .pulse{animation:p 2.4s ease-in-out infinite;transform-origin:center;transform-box:fill-box}
    @keyframes p{0%,100%{transform:scale(1)}50%{transform:scale(1.25)}}
    @media (prefers-reduced-motion:reduce){.sweep,.pulse{animation:none}.fade{animation:none;opacity:1}}
  </style>
  <rect class="bg" width="1200" height="420" rx="24"/>

  <!-- the card being read -->
  <g transform="translate(820 92)">
    <rect class="card" width="300" height="200" rx="14" stroke-width="2"/>
    <rect class="line" x="20" y="22" width="60" height="14" rx="4"/>
    <rect class="acc" x="196" y="20" width="84" height="18" rx="4" opacity=".9"/>
    <rect class="line" x="20" y="60" width="180" height="10" rx="4"/>
    <rect class="line" x="20" y="82" width="150" height="10" rx="4"/>
    <rect class="line" x="20" y="104" width="120" height="10" rx="4"/>
    <rect class="line" x="20" y="146" width="70" height="10" rx="4"/>
    <rect class="line" x="110" y="146" width="70" height="10" rx="4"/>
    <rect class="line" x="210" y="56" width="70" height="88" rx="8"/>
    <rect class="scan sweep" x="0" y="8" width="300" height="16" rx="4"/>
  </g>
  <g class="fade f5" transform="translate(820 316)">
    <circle class="ok pulse" cx="10" cy="10" r="6"/>
    <text class="mute" x="26" y="15" font-size="16">every EPIC read by 4 readers, checked 3 ways</text>
  </g>

  <!-- title -->
  <text class="acc fade" x="72" y="104" font-size="18" font-weight="600" letter-spacing="3">SIR FINAL ELECTORAL ROLL · 27 OCT 2026</text>
  <text class="ink fade f2" x="72" y="160" font-size="52" font-weight="750">Karnataka Final Roll</text>
  <text class="mute fade f3" x="72" y="200" font-size="22">Type your EPIC. Get your constituency, booth and serial, with the official PDF.</text>

  <!-- stats -->
  <g class="fade f4" transform="translate(72 248)">
    <rect class="chip" width="216" height="100" rx="14" stroke-width="1.5"/>
    <text class="ink" x="20" y="50" font-size="30" font-weight="700">4,54,55,689</text>
    <text class="mute" x="20" y="78" font-size="15">electors on the site</text>
    <g transform="translate(232 0)">
      <rect class="chip" width="196" height="100" rx="14" stroke-width="1.5"/>
      <text class="ink" x="20" y="50" font-size="30" font-weight="700">224 / 224</text>
      <text class="mute" x="20" y="78" font-size="15">ACs = CEO count</text>
    </g>
    <g transform="translate(444 0)">
      <rect class="chip" width="196" height="100" rx="14" stroke-width="1.5"/>
      <text class="ink" x="20" y="50" font-size="30" font-weight="700">60,923</text>
      <text class="mute" x="20" y="78" font-size="15">booths, every one</text>
    </g>
  </g>
</svg>
